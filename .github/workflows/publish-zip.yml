name: Publish Windows zip
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-zip.yml"
      - "release-source.json"
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download zip, verify, create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SRC=release-source.json
          TAG=$(jq -r .tag "$SRC")
          NAME=$(jq -r .name "$SRC")
          TITLE=$(jq -r .title "$SRC")
          URL=$(jq -r .url "$SRC")
          SHA=$(jq -r .sha256 "$SRC")
          curl -fsSL -o "$NAME" "$URL"
          echo "$SHA  $NAME" | sha256sum -c
          file "$NAME"
          NOTES=$(jq -r .notes "$SRC")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
            git push origin ":refs/tags/$TAG" || true
          fi
          gh release create "$TAG" "$NAME" --title "$TITLE" --notes "$NOTES"
